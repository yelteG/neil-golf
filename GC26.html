<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5A43">
<title>GC26 Scorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#15241D; --muted:#5B6B63; --line:#D3DCD6;
  --fair:#1D5A43; --fair-ink:#FFFFFF; --flag:#E2B32B; --sea:#2F5E77;
  --good:#1F8A55; --good-bg:#D8F0E2; --mid-bg:#F1F3EF; --bad:#C0453A; --bad-bg:#F8DEDA;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1512;--surface:#16211C;--sunk:#1D2A24;--ink:#E4ECE7;--muted:#95A69D;--line:#2A3831;
  --fair:#2E7A5B;--fair-ink:#F2FBF6;--flag:#EFC54A;--sea:#7FB2CC;
  --good:#5CCB8E;--good-bg:#173A2A;--mid-bg:#1B2621;--bad:#F08377;--bad-bg:#3F201C;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1512;--surface:#16211C;--sunk:#1D2A24;--ink:#E4ECE7;--muted:#95A69D;--line:#2A3831;
  --fair:#2E7A5B;--fair-ink:#F2FBF6;--flag:#EFC54A;--sea:#7FB2CC;
  --good:#5CCB8E;--good-bg:#173A2A;--mid-bg:#1B2621;--bad:#F08377;--bad-bg:#3F201C;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fair);color:var(--fair-ink);margin-inline:-16px;padding:12px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font:700 30px/1 var(--display);letter-spacing:.02em;margin:0}
.brand h1 b{color:var(--flag)}
.brand .sub{font-size:13px;opacity:.85}
.live{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9}
.live i{width:8px;height:8px;border-radius:50%;background:var(--flag);display:inline-block}
.live.off i{background:#999}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:inherit;opacity:.75;font:600 16px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:10px 12px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--flag)}
nav.tabs button:focus-visible{outline:2px solid var(--flag);outline-offset:-2px}
h2{font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:24px 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* leaderboard */
.lb{display:flex;flex-direction:column}
.lb .row{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.lb .row:first-child{border-top:0}
.pos{font:700 22px/1 var(--display);text-align:center}
.row.p1 .pos{color:var(--flag)}
.who{min-width:0}
.who .n{font-weight:600}
.who .m{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.tot{font:700 30px/1 var(--display);text-align:right;min-width:48px}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap}
th{font:600 12px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tbody tr+tr td{border-top:1px solid var(--line)}
td.hi{background:var(--good-bg);color:var(--good);font-weight:700}
td.lo{background:var(--bad-bg);color:var(--bad);font-weight:700}
td.md{background:var(--mid-bg)}
.pts{display:inline-block;min-width:26px;text-align:center;font:700 15px/1.6 var(--display);border-radius:4px;padding:0 4px}
.pts.hi{background:var(--good-bg);color:var(--good)} .pts.lo{background:var(--bad-bg);color:var(--bad)} .pts.md{background:var(--sunk)}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ent{padding:12px 14px}
.ent h3{margin:0;font:700 20px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.ent .mem{font-size:13px;color:var(--muted);margin:2px 0 10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,select{font:600 20px/1 var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
select{font-size:15px;font-weight:500}
input:focus,select:focus{outline:none;border-color:var(--fair);box-shadow:0 0 0 3px color-mix(in srgb,var(--fair) 25%,transparent)}
input:disabled,select:disabled{opacity:.6}
.out{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted);align-items:center}
.plist{padding:0}
.prow{display:grid;grid-template-columns:1fr 74px 74px 96px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.prow.hd{border-top:0;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:4px}
.prow input{font-size:18px;padding:7px 8px;text-align:center}
.prow .res{display:flex;gap:3px;justify-content:flex-end}
.gh{font:700 17px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;padding:12px 12px 2px;color:var(--sea)}
.aw{display:grid;grid-template-columns:1fr 150px 64px;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.aw:first-child{border-top:0}
.aw .k{font-weight:600}
.aw .k small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.aw input{font-size:15px;padding:8px;text-align:center}
.status{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:1.3em}
.note{padding:12px 14px;font-size:14px}
.btn{font:600 15px/1 var(--body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.primary{background:var(--fair);border-color:var(--fair);color:var(--fair-ink)}
.btn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.srow{display:grid;grid-template-columns:1fr 64px 96px 96px;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.srow input,.srow select{font-size:15px;padding:7px 8px}
.rules{padding:4px 14px 12px;font-size:14px}
.rules dt{font-weight:600;margin-top:10px}
.rules dd{margin:2px 0 0;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
@media (max-width:480px){
  .prow{grid-template-columns:1fr 62px 62px;} .prow .res{grid-column:1/-1;justify-content:flex-start}
  .prow.hd>span:last-child{display:none}
  .aw{grid-template-columns:1fr 130px;} .aw input{grid-column:2}
  .srow{grid-template-columns:1fr 56px;} .srow select{grid-column:span 1}
}
@media (prefers-reduced-motion:no-preference){.flash{animation:fl .9s ease-out}@keyframes fl{from{background:color-mix(in srgb,var(--flag) 35%,transparent)}}}
</style>

<script>
// Pure scoring logic for GC26 — shared by the page and a one-off node check.
const D1_SCALE = [8, 6, 4, 2];
const D2_SCALE = [6, 4, 2];        // groups of 3 (or fewer)
const D2_SCALE_4 = [6, 5, 3, 2];   // groups of 4+ — same average points per player as a group of 3
// Group size = players in the group who have a score for that segment (a no-show doesn't count).
const d2Scale = n => n >= 4 ? D2_SCALE_4 : D2_SCALE;
const AWARDS = [];
for (const day of [1, 2]) for (const kind of ["CTP", "LD"]) for (const nine of ["Front 9", "Back 9"]) for (const n of [1, 2])
  AWARDS.push({ id: `d${day}-${kind.toLowerCase()}-${nine === "Front 9" ? "f9" : "b9"}-${n}`, day, kind, nine });

const num = v => (v === null || v === undefined || v === "" || isNaN(+v)) ? null : +v;

// Position = 1 + number strictly better; ties share the better placing.
function rankPoints(entries, higherBetter, scale) {
  const out = {};
  const vals = entries.filter(e => e.v !== null);
  for (const e of entries) {
    if (e.v === null) { out[e.id] = null; continue; }
    const better = vals.filter(o => higherBetter ? o.v > e.v : o.v < e.v).length;
    out[e.id] = scale[Math.min(better, scale.length - 1)];
  }
  return out;
}

function compute(config, d1, d2, bonus) {
  const players = config.players || [];
  const teams = [...new Set(players.map(p => p.team))].sort();
  const groups = [...new Set(players.map(p => p.group))].sort();
  const d1t = (d1 && d1.teams) || {};
  const d2p = (d2 && d2.players) || {};
  const aw = (bonus && bonus.awards) || {};

  // Day 1 — Ambrose, net = gross − half team HCP per nine
  const team = {};
  for (const t of teams) {
    const mem = players.filter(p => p.team === t);
    const comb = mem.reduce((s, p) => s + (+p.hcp || 0), 0);
    const hcp = mem.length ? comb / (2 * mem.length) : 0;
    const g = d1t[t] || {};
    const f9 = num(g.f9), b9 = num(g.b9);
    const g18 = f9 !== null && b9 !== null ? f9 + b9 : null;
    team[t] = {
      id: t, members: mem, comb, hcp, f9, b9, g18,
      nf9: f9 === null ? null : f9 - hcp / 2,
      nb9: b9 === null ? null : b9 - hcp / 2,
      n18: g18 === null ? null : g18 - hcp,
    };
  }
  for (const seg of ["f9", "b9", "18"]) {
    const key = "n" + seg;
    const pts = rankPoints(teams.map(t => ({ id: t, v: team[t][key] })), false, D1_SCALE);
    for (const t of teams) team[t]["p" + seg] = pts[t];
  }
  for (const t of teams) {
    const T = team[t];
    T.d1pts = [T.pf9, T.pb9, T.p18].reduce((s, v) => s + (v || 0), 0);
  }

  // Day 2 — individual Stableford, ranked inside each group
  const pl = {};
  for (const p of players) {
    const s = d2p[p.id] || {};
    const f9 = num(s.f9), b9 = num(s.b9);
    pl[p.id] = { ...p, f9, b9, t18: f9 !== null && b9 !== null ? f9 + b9 : null, bonus: 0 };
  }
  for (const gr of groups) {
    const mem = players.filter(p => p.group === gr);
    for (const seg of ["f9", "b9", "t18"]) {
      const entries = mem.map(p => ({ id: p.id, v: pl[p.id][seg] }));
      const pts = rankPoints(entries, true, d2Scale(entries.filter(e => e.v !== null).length));
      for (const p of mem) pl[p.id]["p" + seg] = pts[p.id];
    }
  }
  for (const a of AWARDS) { const w = aw[a.id] && aw[a.id].w; if (w && pl[w]) pl[w].bonus++; }
  for (const id in pl) {
    const P = pl[id];
    P.d1 = team[P.team] ? team[P.team].d1pts : 0;
    P.d2pts = (P.pf9 || 0) + (P.pb9 || 0) + (P.pt18 || 0);
    P.mvp = P.d2pts + P.bonus + P.d1 / 2;
  }
  const list = Object.values(pl);
  for (const P of list) P.rank = 1 + list.filter(o => o.mvp > P.mvp).length;
  list.sort((a, b) => b.mvp - a.mvp || a.name.localeCompare(b.name));

  // Team winner — Day 1 points + Day 2 team points.
  // Day 2: each team's AVERAGE Stableford (players with a score) is ranked for F9, B9 and 18: 8 / 6 / 4 / 2.
  // 18 counts a player as soon as either nine is in (same as the sheet's D2 Total column).
  const avg = xs => xs.length ? xs.reduce((s, v) => s + v, 0) / xs.length : null;
  for (const t of teams) {
    const T = team[t], m = T.members.map(p => pl[p.id]);
    T.a9f = avg(m.map(p => p.f9).filter(v => v !== null));
    T.a9b = avg(m.map(p => p.b9).filter(v => v !== null));
    T.a18 = avg(m.filter(p => p.f9 !== null || p.b9 !== null).map(p => (p.f9 || 0) + (p.b9 || 0)));
  }
  for (const [seg, key] of [["f9", "a9f"], ["b9", "a9b"], ["18", "a18"]]) {
    const pts = rankPoints(teams.map(t => ({ id: t, v: team[t][key] })), true, D1_SCALE);
    for (const t of teams) team[t]["q" + seg] = pts[t];
  }
  for (const t of teams) {
    const T = team[t];
    T.d2pts = (T.qf9 || 0) + (T.qb9 || 0) + (T.q18 || 0);
    T.total = T.d1pts + T.d2pts;
  }
  // Ties on total are split by the higher Day 2 18-hole average; still level = shared placing.
  const a18 = T => T.a18 === null ? -Infinity : T.a18;
  for (const t of teams) { const T = team[t];
    T.rank = 1 + teams.filter(o => team[o].total > T.total || (team[o].total === T.total && a18(team[o]) > a18(T))).length; }

  return { players: list, byId: pl, teams: teams.map(t => team[t]), groups };
}



</script>
<script>
(function(){
const $main=document.getElementById("main");
const S={config:null,d1:null,d2:null,bonus:null,canWrite:true,tab:"mvp",pending:false,inflight:0,lastSync:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>v===null||v===undefined?"–":(Math.round(v*100)/100).toString();
const f2=v=>v===null||v===undefined?"–":v.toFixed(2);
const DEMO=!API_URL;

const TABS=["mvp","teams","day1","day2","bonus","rules"];
try{const h=location.hash.slice(1);if(TABS.includes(h))S.tab=h;else{const t=localStorage.getItem("gc26tab");if(TABS.includes(t))S.tab=t;}}catch(e){}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;S.tab=b.dataset.tab;try{localStorage.setItem("gc26tab",S.tab);history.replaceState(null,"","#"+S.tab)}catch(e){}render(true);window.scrollTo({top:0});});

// ---------- colour helpers ----------
// For a set of comparable values: best -> hi, worst -> lo, rest -> md
function tone(vals,v,higherBetter){
  const xs=vals.filter(x=>x!==null&&x!==undefined);
  if(v===null||v===undefined||xs.length<2)return"";
  const mx=Math.max(...xs),mn=Math.min(...xs); if(mx===mn)return"md";
  const best=higherBetter?mx:mn,worst=higherBetter?mn:mx;
  return v===best?"hi":v===worst?"lo":"md";
}
const ptsTone=(v,scale)=>v===null||v===undefined?"":v===scale[0]?"hi":v===scale[scale.length-1]?"lo":"md";
const pts=(v,scale)=>`<span class="pts ${ptsTone(v,scale)}">${v??"–"}</span>`;

// ---------- views ----------
function vMVP(R){
  if(!R.players.length)return`<div class="empty">No players yet.</div>`;
  const rows=R.players.map(p=>`<div class="row ${p.rank===1&&p.mvp>0?"p1":""}">
    <div class="pos num">${p.rank}</div>
    <div class="who"><div class="n">${esc(p.name)}</div><div class="m">${esc(p.team)} · ${esc(p.group)} · HCP ${esc(p.hcp)}</div>
      <div class="chips num"><span class="chip">D1 ½ <b>${fmt(p.d1/2)}</b></span><span class="chip">F9 <b>${p.pf9??"–"}</b></span><span class="chip">B9 <b>${p.pb9??"–"}</b></span><span class="chip">18 <b>${p.pt18??"–"}</b></span><span class="chip">Bonus <b>${p.bonus}</b></span></div></div>
    <div class="tot num">${fmt(p.mvp)}</div></div>`).join("");
  return`<h2>MVP leaderboard</h2><p class="lede">Day 2 points (Front 9, Back 9, 18) + CTP/LD bonuses + half your team's Day 1 points.</p><div class="card lb">${rows}</div>`;
}
function vTeams(R){
  const T=R.teams,col=k=>T.map(t=>t[k]);
  const a1=v=>v===null||v===undefined?"–":v.toFixed(1);
  const w=T.slice().sort((a,b)=>a.rank-b.rank||a.id.localeCompare(b.id)).map(t=>`<tr><td><b>${esc(t.id)}</b></td>
    <td class="num ${tone(col("rank"),t.rank,false)}">${t.rank}</td><td class="num ${tone(col("total"),t.total,true)}"><b>${t.total}</b></td>
    <td class="num ${tone(col("d1pts"),t.d1pts,true)}">${t.d1pts}</td><td class="num ${tone(col("d2pts"),t.d2pts,true)}">${t.d2pts}</td></tr>`).join("");
  const d2=T.map(t=>`<tr><td><b>${esc(t.id)}</b><div class="muted" style="font-size:12px">${t.members.length} players</div></td>
    <td class="num ${tone(col("a9f"),t.a9f,true)}">${a1(t.a9f)}</td><td class="num ${tone(col("a9b"),t.a9b,true)}">${a1(t.a9b)}</td><td class="num ${tone(col("a18"),t.a18,true)}">${a1(t.a18)}</td>
    <td class="num ${tone(col("qf9"),t.qf9,true)}">${t.qf9??"–"}</td><td class="num ${tone(col("qb9"),t.qb9,true)}">${t.qb9??"–"}</td><td class="num ${tone(col("q18"),t.q18,true)}">${t.q18??"–"}</td>
    <td class="num ${tone(col("d2pts"),t.d2pts,true)}"><b>${t.d2pts}</b></td></tr>`).join("");
  const d1=T.map(t=>`<tr><td><b>${esc(t.id)}</b><div class="muted" style="font-size:12px">HCP ${f2(t.hcp)}</div></td>
    <td class="num ${tone(col("f9"),t.f9,false)}">${fmt(t.f9)}</td><td class="num ${tone(col("b9"),t.b9,false)}">${fmt(t.b9)}</td><td class="num ${tone(col("g18"),t.g18,false)}">${fmt(t.g18)}</td>
    <td class="num ${tone(col("nf9"),t.nf9,false)}">${f2(t.nf9)}</td><td class="num ${tone(col("nb9"),t.nb9,false)}">${f2(t.nb9)}</td><td class="num ${tone(col("n18"),t.n18,false)}">${f2(t.n18)}</td>
    <td class="num ${tone(col("pf9"),t.pf9,true)}">${t.pf9??"–"}</td><td class="num ${tone(col("pb9"),t.pb9,true)}">${t.pb9??"–"}</td><td class="num ${tone(col("p18"),t.p18,true)}">${t.p18??"–"}</td>
    <td class="num ${tone(col("d1pts"),t.d1pts,true)}"><b>${t.d1pts}</b></td></tr>`).join("");
  return`<h2>Team winner</h2><p class="lede">Day 1 Ambrose points + Day 2 team points, up to 24 each (48 total). Level on total? Higher Day 2 18-hole average wins.</p>
  <div class="card tbl"><table><thead><tr><th>Team</th><th>Rank</th><th>Total</th><th>D1 pts</th><th>D2 pts</th></tr></thead><tbody>${w}</tbody></table></div>
  <h2>Day 2 · Team Stableford</h2><p class="lede">Lonsdale Links. Each team's average Stableford (players with a score) is ranked for Front 9, Back 9 and 18: 8 / 6 / 4 / 2. Teams of 3 and 4 compete evenly.</p>
  <div class="card tbl"><table><thead><tr><th>Team</th><th>F9 avg</th><th>B9 avg</th><th>18 avg</th><th>F9 pts</th><th>B9 pts</th><th>18 pts</th><th>Total</th></tr></thead><tbody>${d2}</tbody></table></div>
  <h2>Day 1 · Ambrose</h2><p class="lede">13th Beach (Creek). Net = gross − half the team handicap per nine. Lowest net wins each segment: 8 / 6 / 4 / 2.</p>
  <div class="card tbl"><table><thead><tr><th>Team</th><th>F9 gross</th><th>B9 gross</th><th>18 gross</th><th>F9 net</th><th>B9 net</th><th>18 net</th><th>F9 pts</th><th>B9 pts</th><th>18 pts</th><th>Total</th></tr></thead><tbody>${d1}</tbody></table></div>`;
}
const dis=()=>S.canWrite?"":"disabled";
function inp(id,doc,path,val,label){id=id.replace(/[^A-Za-z0-9-]/g,"_");return`<input id="${id}" type="number" inputmode="numeric" min="0" max="99" ${dis()} data-doc="${doc}" data-path="${esc(path.join("|"))}" value="${val??""}" aria-label="${esc(label)}">`}
function vDay1(R){
  const s=[8,6,4,2];
  const cards=R.teams.map(t=>`<div class="card ent"><h3><span>${esc(t.id)}</span><span class="muted num" style="font-size:15px">HCP ${f2(t.hcp)}</span></h3>
    <div class="mem">${t.members.map(m=>esc(m.name)).join(", ")}</div>
    <div class="fields"><label class="f">Front 9 gross${inp("d1-"+t.id+"-f9","d1",["teams",t.id,"f9"],t.f9,t.id+" front 9 gross")}</label>
    <label class="f">Back 9 gross${inp("d1-"+t.id+"-b9","d1",["teams",t.id,"b9"],t.b9,t.id+" back 9 gross")}</label></div>
    <div class="out num">Net ${f2(t.nf9)} / ${f2(t.nb9)} · 18 ${f2(t.n18)} <span style="margin-left:auto">Pts ${pts(t.pf9,s)} ${pts(t.pb9,s)} ${pts(t.p18,s)} = <b style="color:var(--ink)">${t.d1pts}</b></span></div></div>`).join("");
  return`<h2>Day 1 · Sat 24 Oct</h2><p class="lede">13th Beach Golf Links (Creek), 2:30 pm, Ambrose. Enter each team's gross score for each nine. Scores save when you leave the box.</p><div class="grid">${cards}</div>${statusLine()}`;
}
function vDay2(R){
  const blocks=R.groups.map(g=>{
    const mem=R.players.filter(p=>p.group===g).sort((a,b)=>a.name.localeCompare(b.name));
    const s=d2Scale(mem.length);
    return`<div class="gh">${esc(g)} <span class="muted" style="font-size:13px;letter-spacing:0">· ${s.join(" / ")}</span></div><div class="prow hd"><span>Player</span><span>F9 pts</span><span>B9 pts</span><span style="text-align:right">F9 · B9 · 18</span></div>`+
    mem.map(p=>`<div class="prow"><div><b>${esc(p.name)}</b> <span class="muted" style="font-size:12px">${esc(p.team)} · ${p.t18??"–"} total</span></div>
      ${inp("d2-"+p.id+"-f9","d2",["players",p.id,"f9"],p.f9,p.name+" front 9 stableford")}
      ${inp("d2-"+p.id+"-b9","d2",["players",p.id,"b9"],p.b9,p.name+" back 9 stableford")}
      <div class="res num">${pts(p.pf9,s)}${pts(p.pb9,s)}${pts(p.pt18,s)}</div></div>`).join("");
  }).join("");
  return`<h2>Day 2 · Sun 25 Oct</h2><p class="lede">Lonsdale Links, 12:12 pm, Stableford. Enter each player's Stableford points for each nine. Points are ranked within the group: 6 / 4 / 2 in a group of 3, 6 / 5 / 3 / 2 in a group of 4.</p><div class="card plist">${blocks}</div>${statusLine()}`;
}
function vBonus(R){
  const opts=sel=>`<option value="">No winner yet</option>`+R.players.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${esc(p.id)}" ${p.id===sel?"selected":""}>${esc(p.name)}</option>`).join("");
  const aw=(S.bonus&&S.bonus.awards)||{};
  const day=d=>AWARDS.filter(a=>a.day===d).map(a=>{const v=aw[a.id]||{};const n=a.id.endsWith("-2")?"2":"1";
    return`<div class="aw"><div class="k">${a.kind==="CTP"?"Closest to pin":"Longest drive"}<small>${a.nine} · #${n}</small></div>
    <select id="bw-${a.id}" ${dis()} data-doc="bonus" data-path="awards|${a.id}|w" aria-label="${a.kind} ${a.nine} ${n} winner">${opts(v.w)}</select>
    <input id="bh-${a.id}" type="text" inputmode="numeric" ${dis()} placeholder="Hole" data-doc="bonus" data-path="awards|${a.id}|hole" data-text="1" value="${esc(v.hole||"")}" aria-label="Hole number"></div>`}).join("");
  const tally=R.players.filter(p=>p.bonus>0).sort((a,b)=>b.bonus-a.bonus).map(p=>`<span class="chip">${esc(p.name)} <b>${p.bonus}</b></span>`).join("")||`<span class="muted">No winners yet</span>`;
  return`<h2>Closest to pin &amp; longest drive</h2><p class="lede">1 bonus point each, 16 up for grabs across both days.</p><div class="chips" style="margin-bottom:12px">${tally}</div>
  <div class="gh" style="padding-left:0">Day 1</div><div class="card">${day(1)}</div><div class="gh" style="padding-left:0">Day 2</div><div class="card">${day(2)}</div>${statusLine()}`;
}


function vRules(){
  return`<h2>How scoring works</h2><div class="card rules"><dl>
  <dt>Day 1: Ambrose (team)</dt><dd>Team handicap = combined handicap ÷ (2 × players). Net per nine = gross − half the team handicap. Front 9, Back 9 and 18 are each ranked on net: 8 / 6 / 4 / 2 (up to 24 per team).</dd>
  <dt>Day 2: Stableford (individual)</dt><dd>Front 9, Back 9 and 18 are each ranked within your group (up to 18). Group of 3: 6 / 4 / 2. Group of 4: 6 / 5 / 3 / 2, so every player averages the same points whatever size group they're in. Only players with a score count towards the group size.</dd>
  <dt>Bonus</dt><dd>1 point per closest-to-pin or longest-drive win. 4 per nine, 16 in total.</dd>
  <dt>MVP</dt><dd>Day 2 points + bonuses + half your team's Day 1 points (Day 1 is worth up to 12). Ties share the higher placing.</dd>
  <dt>Team winner</dt><dd>Day 1 teams stay together for the whole trip. Team total = Day 1 Ambrose points + Day 2 team points (up to 24 each, 48 in total). Day 2 team points: each team's average Stableford is ranked for Front 9, Back 9 and 18: 8 / 6 / 4 / 2. Using the average keeps teams of 3 and 4 even. Level on total: the higher Day 2 18-hole average wins.</dd>
  <dt>Players, handicaps, teams and groups</dt><dd>These come from the GC26 Google Sheet. Change them there and the app picks them up within a few seconds.</dd></dl></div>`;
}
function statusLine(){return`<div class="status" id="status">${DEMO?"Demo mode: scores stay on this phone until the Google Sheet is connected.":""}</div>`}

function render(force){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  if(!S.config)return;
  const a=document.activeElement;
  if(!force&&a&&$main.contains(a)&&/INPUT|SELECT/.test(a.tagName)){S.pending=true;return}
  S.pending=false;
  const R=compute(S.config,S.d1,S.d2,S.bonus);
  $main.innerHTML={mvp:vMVP,teams:vTeams,day1:vDay1,day2:vDay2,bonus:vBonus,rules:vRules}[S.tab](R);
}
$main.addEventListener("focusout",()=>setTimeout(()=>{if(S.pending)render()},0));

// ---------- sync with the Google Sheet ----------
const live=document.getElementById("live"),lt=document.getElementById("liveTxt");
function setLive(ok,txt){live.classList.toggle("off",!ok);lt.textContent=txt}
function setStatus(t){const el=document.getElementById("status");if(el)el.textContent=t}
function apply(data){
  if(!data||!data.config)return;
  S.config=data.config;S.d1=data.d1;S.d2=data.d2;S.bonus=data.bonus;S.lastSync=new Date();
  setLive(true,"Live · "+S.lastSync.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
  render();
}
async function pull(){
  if(DEMO||S.inflight)return;
  try{const r=await fetch(API_URL+(API_URL.includes("?")?"&":"?")+"t="+Date.now());const d=await r.json();if(!S.inflight)apply(d)}
  catch(e){setLive(false,"Offline · retrying")}
}
let chain=Promise.resolve();
function save(doc,pathArr,value){
  // optimistic local update
  const cur=S[doc]=JSON.parse(JSON.stringify(S[doc]||{}));let c=cur;
  pathArr.forEach((k,i)=>{if(i===pathArr.length-1)c[k]=value;else c=c[k]=(c[k]&&typeof c[k]==="object")?c[k]:{}});
  if(DEMO){try{localStorage.setItem("gc26demo",JSON.stringify({config:S.config,d1:S.d1,d2:S.d2,bonus:S.bonus}))}catch(e){}setStatus("Saved on this phone (demo mode)");return}
  S.inflight++;setStatus("Saving…");
  const body=JSON.stringify({kind:doc,key:pathArr[1],field:pathArr[2],value});
  chain=chain.then(async()=>{
    for(let attempt=0;attempt<2;attempt++){
      try{const r=await fetch(API_URL,{method:"POST",body});const d=await r.json();
        if(!d.ok)throw new Error(d.error||"Rejected");
        S.inflight--;if(!S.inflight)apply(d.data);setStatus("Saved to the GC26 sheet");return}
      catch(e){if(attempt===1){S.inflight--;setStatus("Couldn't save: "+(e.message||"check your signal")+". Enter it again.");}else await new Promise(r=>setTimeout(r,800))}
    }
  });
}
$main.addEventListener("change",e=>{
  const el=e.target;if(!el.dataset.doc)return;
  let v=el.value.trim();
  if(el.tagName==="SELECT"||el.dataset.text)v=v||null;else v=v===""?null:Math.max(0,Math.round(+v));
  save(el.dataset.doc,el.dataset.path.split("|"),v);
  setTimeout(()=>render(),0);
});
$main.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT")e.target.blur()});

if(DEMO){
  let d=null;try{d=JSON.parse(localStorage.getItem("gc26demo"))}catch(e){}
  apply(d||DEMO_DATA);setLive(false,"Demo");
}else{
  pull();
  setInterval(()=>{if(document.visibilityState==="visible")pull()},10000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});
}
render(true);
})();

</script>
</body>
</html>
